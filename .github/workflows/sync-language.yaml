# https://docs.github.com/en/actions

name: "Sync language/"

on:
  schedule:
    # Every day, 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: null

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  sync-language:
    name: "Sync language/ with php/doc-en"
    runs-on: "ubuntu-latest"
    if: "github.repository_owner == 'php'"

    permissions:
      contents: "write"
      pull-requests: "write"

    steps:
      - name: "Checkout php/doc-extensions"
        uses: "actions/checkout@v7"
        with:
          path: "extensions"

      - name: "Checkout php/doc-en"
        uses: "actions/checkout@v7"
        with:
          path: "en"
          repository: "php/doc-en"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          extensions: "dom, libxml, simplexml"
        env:
          fail-fast: true

      - name: "Regenerate language/ from php/doc-en"
        run: |
          set -euo pipefail
          if ! php extensions/scripts/sync-language.php --doc-en=en; then
            echo "::error::sync-language.php failed; language/manifest.json probably needs an update for the current php/doc-en."
            exit 1
          fi

      - name: "Describe the changes"
        working-directory: "extensions"
        run: |
          set -euo pipefail
          doc_en="$(git -C ../en rev-parse HEAD)"
          {
            echo "Automated sync of \`language/\` with [php/doc-en@${doc_en:0:10}](https://github.com/php/doc-en/commit/${doc_en})."
            echo
            echo "Generated by \`scripts/sync-language.php\` from \`language/manifest.json\`."
            echo "Do not edit the pages by hand, and do not push to this branch: it is force-updated on every run."
            echo
            echo '```'
            git status --short -- language entities/entities.manual.ent
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: "Open or update the pull request"
        uses: "peter-evans/create-pull-request@v7"
        with:
          path: "extensions"
          add-paths: |
            language
            entities/entities.manual.ent
          branch: "sync/language"
          base: "main"
          delete-branch: true
          commit-message: "Sync language/ summaries with php/doc-en"
          title: "Sync language/ summaries with php/doc-en"
          body-path: "${{ runner.temp }}/pr-body.md"
